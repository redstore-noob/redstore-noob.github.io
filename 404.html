<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 · 页面走丢了喵 | NyaLauncher</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="images/nya-icon.png" />
<meta name="theme-color" content="#0e120d" />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --primary:#B8E36B; --tertiary:#9CE7FF;
  --surface:#0E120D; --on-surface:#E6ECDF; --on-surface-variant:#C3CABB;
  --container:#1A2013; --container-high:#23291A; --outline-variant:#3D4433;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
  background:var(--surface);color:var(--on-surface);
  font-family:"Roboto","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  padding:24px;overflow:hidden;
}
.wrap{max-width:520px;}
.cat{
  width:140px;height:140px;border-radius:50%;margin-bottom:24px;
  border:4px solid var(--primary);
  box-shadow:0 0 36px rgba(184,227,107,.4),0 8px 24px rgba(0,0,0,.5);
  animation:float 4s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-12px) rotate(3deg);}}
h1{
  font-size:clamp(3.4rem,10vw,5rem);font-weight:700;letter-spacing:-2px;line-height:1;
  background:linear-gradient(100deg,var(--primary),var(--tertiary),var(--primary));
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:flow 6s ease-in-out infinite;margin-bottom:8px;
}
@keyframes flow{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.quote{color:var(--on-surface-variant);font-style:italic;margin-bottom:28px;}
.quote b{color:var(--primary);font-style:normal;}
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.btn{
  display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 26px;border-radius:999px;
  text-decoration:none;font-weight:600;font-size:.95rem;transition:transform .25s,box-shadow .25s;
}
.btn--filled{background:var(--primary);color:#1F3300;box-shadow:0 1px 3px rgba(0,0,0,.4);}
.btn--filled:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(184,227,107,.3);}
.btn--text{color:var(--primary);border:1px solid var(--outline-variant);}
.btn--text:hover{border-color:var(--primary);}
.code{margin-top:32px;font-family:"JetBrains Mono",monospace;font-size:.75rem;color:var(--on-surface-variant);opacity:.6;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>
  <main class="wrap">
    <img class="cat" src="images/nya-icon.png" alt="Nya 图标" />
    <h1>404</h1>
    <p class="quote">「咦？这个页面被<b>苦力怕</b>炸掉了喵…」<br>—— Nya · 看板娘</p>
    <div class="actions">
      <a class="btn btn--filled" href="index.html">← 回到首页</a>
      <a class="btn btn--text" href="docs/index.html">查看文档</a>
    </div>
    <p class="code">Error: EntityNotFound · Creeper probably did it</p>
  </main>
</body>
</html>
